<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — RepoStew</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .error-page { width: min(calc(100% - 40px), 920px); min-height: 100vh; margin: auto; display: grid; align-content: center; }
      .error-code { margin: 0; color: var(--blue); font: 800 0.75rem/1 var(--mono); letter-spacing: .12em; }
      .error-page h1 { margin: 24px 0; font-family: var(--display); font-size: clamp(3.2rem, 10vw, 7.5rem); line-height: .95; letter-spacing: -.07em; }
      .error-page p { max-width: 620px; color: var(--ink-soft); font-size: 1.05rem; }
      .error-page .english { margin-top: -4px; font-size: .9rem; }
      .error-page .button { width: fit-content; margin-top: 22px; }
    </style>
  </head>
  <body>
    <main class="error-page">
      <p class="error-code">STATUS / 404</p>
      <h1>Page not<br />found.</h1>
      <p>This page does not exist or has moved. Return to RepoStew to continue.</p>
      <p class="english" lang="zh-CN">目标页面不存在，或已经移动。返回 RepoStew 继续。</p>
      <a class="button button-primary" href="index.html">Back home / 返回首页</a>
    </main>
  </body>
</html>
